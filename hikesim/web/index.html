<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ann Arbor Trails</title>
<style>
  :root { --bg:#0e1311; --panel:rgba(14,19,17,.86); --ink:#e9efe9; --dim:#9aa69d; --line:rgba(255,255,255,.12); --accent:#e8b04a; }
  html,body { margin:0; height:100%; background:var(--bg); color:var(--ink); font:14px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; overflow:hidden; }
  #c { position:fixed; inset:0; }
  #panel { position:fixed; top:12px; left:12px; width:320px; max-height:calc(100% - 24px); overflow:auto; background:var(--panel);
           border:1px solid var(--line); border-radius:10px; padding:14px 14px 10px; backdrop-filter:blur(6px); }
  h1 { font-size:17px; margin:0 0 2px; } .sub { color:var(--dim); font-size:12px; margin-bottom:10px; }
  .course { padding:8px 10px; border:1px solid var(--line); border-radius:8px; margin:6px 0; cursor:pointer; }
  .course:hover, .course.on { border-color:var(--accent); }
  .course b { display:block; } .course span { color:var(--dim); font-size:12px; }
  button, select { background:#1d2622; color:var(--ink); border:1px solid var(--line); border-radius:6px; padding:5px 9px; font:inherit; cursor:pointer; }
  button:hover { border-color:var(--accent); }
  .row { display:flex; gap:6px; align-items:center; margin:8px 0; flex-wrap:wrap; }
  #run { width:100%; } #scrub { width:100%; accent-color:var(--accent); }
  #stats { font-size:12px; color:var(--dim); white-space:pre-line; margin-top:6px; }
  #legend { position:fixed; right:12px; bottom:12px; background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:8px 10px; font-size:12px; }
  #legend i { display:inline-block; width:18px; height:4px; margin:0 6px 2px 0; vertical-align:middle; border-radius:2px; }
  #tip { position:fixed; pointer-events:none; background:var(--panel); border:1px solid var(--line); border-radius:6px; padding:4px 8px; font-size:12px; display:none; }
  #hud { position:fixed; right:12px; top:12px; background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:8px 12px; font-size:13px; display:none; }
  @media (max-width:640px){ #panel{ width:auto; right:12px; max-height:45%; } #legend{ display:none; } }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="panel">
  <h1>Ann Arbor trails</h1>
  <div class="sub" id="sub">USGS 1 m lidar terrain, NAIP aerial photo, OpenStreetMap trails. A Unitree G1 hikes them in MuJoCo.</div>
  <div class="row"><button id="home">Whole area</button><label><input type="checkbox" id="exag"> 3x height</label><label><input type="checkbox" id="photo" checked> Aerial photo</label></div>
  <div id="courses"></div>
  <div id="runbox" style="display:none">
    <div class="row"><select id="run"></select></div>
    <div class="row"><select id="ghost"></select></div>
    <div class="row"><button id="play">Pause</button><button id="chase">Free camera</button><button id="speed">1x</button></div>
    <input type="range" id="scrub" min="0" max="1000" value="0">
    <div id="stats"></div>
  </div>
</div>
<div id="legend"><div><i style="background:#3fbf6a"></i>under 5 deg</div><div><i style="background:#e6d14a"></i>5 to 10</div><div><i style="background:#ef8a2f"></i>10 to 15</div><div><i style="background:#e0413a"></i>over 15</div></div>
<div id="tip"></div>
<div id="hud"></div>

<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
               "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/" } }
</script>
<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";
import { STLLoader } from "three/addons/loaders/STLLoader.js";

const $ = (id) => document.getElementById(id);
const renderer = new THREE.WebGLRenderer({ canvas: $("c"), antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.outputColorSpace = THREE.SRGBColorSpace;
const scene = new THREE.Scene();
scene.background = new THREE.Color(0xbcd3e6);
scene.fog = new THREE.Fog(0xbcd3e6, 2000, 9000);
const camera = new THREE.PerspectiveCamera(45, 1, 0.1, 30000);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
scene.add(new THREE.HemisphereLight(0xdfeaff, 0x40372b, 1.1));
const sun = new THREE.DirectionalLight(0xffffff, 1.6);
sun.position.set(-300, 600, 400);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
scene.add(sun, sun.target);

// Everything lives in MuJoCo's z-up frame (x east, y north) inside this group.
const world = new THREE.Group();
world.rotation.x = -Math.PI / 2;
scene.add(world);
const toScene = (x, y, z) => new THREE.Vector3(x, z, -y);

const gradeColor = (g) => g == null ? new THREE.Color(0x8a8f8a) : g < 5 ? new THREE.Color(0x3fbf6a) : g < 10 ? new THREE.Color(0xe6d14a) : g < 15 ? new THREE.Color(0xef8a2f) : new THREE.Color(0xe0413a);

let manifest, robotDef, stl = {}, current = null, exag = 1;
const getF32 = async (url) => new Float32Array(await (await fetch(url)).arrayBuffer());

function terrainMesh(h, z, cell, texUrl, zbase) {
  const { nx, ny } = h;
  const pos = new Float32Array(nx * ny * 3), uv = new Float32Array(nx * ny * 2);
  for (let j = 0; j < ny; j++) for (let i = 0; i < nx; i++) {
    const k = j * nx + i;
    pos.set([(i + 0.5) * cell, (j + 0.5) * cell, (z[k] - zbase) * exag], k * 3);
    uv.set([i / (nx - 1), j / (ny - 1)], k * 2);
  }
  const idx = new Uint32Array((nx - 1) * (ny - 1) * 6);
  let n = 0;
  for (let j = 0; j < ny - 1; j++) for (let i = 0; i < nx - 1; i++) {
    const a = j * nx + i, b = a + 1, c = a + nx, d = c + 1;
    idx.set([a, b, d, a, d, c], n); n += 6;
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute("position", new THREE.BufferAttribute(pos, 3));
  g.setAttribute("uv", new THREE.BufferAttribute(uv, 2));
  g.setIndex(new THREE.BufferAttribute(idx, 1));
  g.computeVertexNormals();
  const mat = new THREE.MeshStandardMaterial({ color: 0x9c8f6e, roughness: 0.95, metalness: 0 });
  if (texUrl && $("photo").checked) {
    new THREE.TextureLoader().load(texUrl, (t) => { t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 8; mat.map = t; mat.color.set(0xffffff); mat.needsUpdate = true; });
  }
  const m = new THREE.Mesh(g, mat);
  m.receiveShadow = true;
  return m;
}

function heightAt(h, z, cell, x, y) {
  const fx = Math.min(Math.max(x / cell - 0.5, 0), h.nx - 1.001), fy = Math.min(Math.max(y / cell - 0.5, 0), h.ny - 1.001);
  const i = Math.floor(fx), j = Math.floor(fy), tx = fx - i, ty = fy - j, k = j * h.nx + i;
  return z[k] * (1 - tx) * (1 - ty) + z[k + 1] * tx * (1 - ty) + z[k + h.nx] * (1 - tx) * ty + z[k + h.nx + 1] * tx * ty;
}

function clearWorld() {
  for (const c of [...world.children]) { world.remove(c); c.traverse?.((o) => { o.geometry?.dispose?.(); }); }
}

// ---------------- Area overview ----------------
let pins = [];
async function showArea() {
  current = null; clearWorld(); pins = [];
  $("runbox").style.display = "none"; $("hud").style.display = "none";
  document.querySelectorAll(".course").forEach((e) => e.classList.remove("on"));
  const A = manifest.area, base = "area/";
  const z = await getF32(base + A.height.file);
  const zbase = A.height.zmin;
  world.add(terrainMesh(A.height, z, A.cell, A.aerial ? base + A.aerial : null, zbase));
  const trails = await (await fetch(base + A.trails)).json();
  const pos = [], col = [];
  for (const t of trails) {
    const c = gradeColor(t.max_grade);
    for (let k = 0; k + 3 < t.xy.length; k += 2) {
      for (const q of [k, k + 2]) {
        const x = t.xy[q], y = t.xy[q + 1];
        pos.push(x, y, (heightAt(A.height, z, A.cell, x, y) - zbase) * exag + 3);
        col.push(c.r, c.g, c.b);
      }
    }
  }
  const lg = new THREE.BufferGeometry();
  lg.setAttribute("position", new THREE.Float32BufferAttribute(pos, 3));
  lg.setAttribute("color", new THREE.Float32BufferAttribute(col, 3));
  world.add(new THREE.LineSegments(lg, new THREE.LineBasicMaterial({ vertexColors: true })));
  // Course pins
  for (const C of manifest.courses) {
    const ox = C.utm_origin[0] - A.utm_origin[0], oy = C.utm_origin[1] - A.utm_origin[1];
    const r = C.route, x = ox + r[0], y = oy + r[1];
    const zz = (heightAt(A.height, z, A.cell, x, y) - zbase) * exag;
    const pin = new THREE.Mesh(new THREE.ConeGeometry(40, 120, 12), new THREE.MeshStandardMaterial({ color: 0xe8b04a, emissive: 0x332200 }));
    pin.rotation.x = -Math.PI / 2;
    pin.position.set(x, y, zz + 70);
    pin.userData.course = C;
    world.add(pin); pins.push(pin);
  }
  const cx = A.size[0] / 2, cy = A.size[1] / 2;
  controls.target.copy(toScene(cx, cy, 0));
  camera.position.copy(toScene(cx - A.size[0] * 0.15, cy - A.size[1] * 0.85, A.size[0] * 0.55));
  scene.fog.near = 4000; scene.fog.far = 20000;
  $("sub").textContent = `${trails.length} trail segments, ${(trails.reduce((s, t) => s + (t.length_m || 0), 0) / 1000).toFixed(0)} km. Click a pin or a course.`;
}

// ---------------- Course view ----------------
let robot = null, run = null, poses = null, frame = 0, playing = true, chase = true, rate = 1, courseZ = null;
let ghost = null, ghostRun = null, ghostPoses = null;
async function loadRobot() {
  robotDef = await (await fetch("robot.json")).json();
  const loader = new STLLoader();
  const files = [...new Set(robotDef.geoms.map((g) => g.mesh))];
  await Promise.all(files.map(async (f) => { stl[f] = loader.parse(await (await fetch("meshes/" + f)).arrayBuffer()); }));
}
function makeRobot(isGhost = false) {
  const g = new THREE.Group();
  const bodies = robotDef.bodies.map(() => { const b = new THREE.Group(); g.add(b); return b; });
  for (const d of robotDef.geoms) {
    const geomObj = new THREE.Group();
    geomObj.position.set(...d.pos);
    geomObj.quaternion.set(d.quat[1], d.quat[2], d.quat[3], d.quat[0]);
    const mq = new THREE.Quaternion(d.mesh_quat[1], d.mesh_quat[2], d.mesh_quat[3], d.mesh_quat[0]).invert();
    const mat = isGhost
      ? new THREE.MeshStandardMaterial({ color: 0x7fb2ff, roughness: 0.6, metalness: 0, transparent: true, opacity: 0.35, depthWrite: false })
      : new THREE.MeshStandardMaterial({ color: new THREE.Color(d.rgba[0], d.rgba[1], d.rgba[2]), roughness: 0.45, metalness: 0.35 });
    const mesh = new THREE.Mesh(stl[d.mesh], mat);
    mesh.quaternion.copy(mq);
    mesh.position.copy(new THREE.Vector3(...d.mesh_pos).applyQuaternion(mq).multiplyScalar(-1));
    mesh.castShadow = !isGhost;
    geomObj.add(mesh);
    bodies[d.body].add(geomObj);
  }
  g.userData.bodies = bodies;
  return g;
}

async function showCourse(C) {
  current = C; clearWorld();
  document.querySelectorAll(".course").forEach((e) => e.classList.toggle("on", e.dataset.slug === C.slug));
  const base = `courses/${C.slug}/`;
  const z = await getF32(base + C.height.file);
  courseZ = { z, h: C.height, base: C.height.zmin };
  world.add(terrainMesh(C.height, z, C.cell, C.aerial ? base + C.aerial : null, C.height.zmin));
  // route ribbon coloured by grade
  const r = C.route, pos = [], col = [];
  for (let k = 0; k + 4 < r.length; k += 4) {
    for (const q of [k, k + 4]) {
      pos.push(r[q], r[q + 1], (heightAt(C.height, z, C.cell, r[q], r[q + 1]) - C.height.zmin) * exag + 0.25);
      const c = gradeColor(Math.abs(r[q + 3])); col.push(c.r, c.g, c.b);
    }
  }
  const lg = new THREE.BufferGeometry();
  lg.setAttribute("position", new THREE.Float32BufferAttribute(pos, 3));
  lg.setAttribute("color", new THREE.Float32BufferAttribute(col, 3));
  world.add(new THREE.LineSegments(lg, new THREE.LineBasicMaterial({ vertexColors: true })));
  if (!robotDef) await loadRobot();
  robot = makeRobot();
  world.add(robot);
  ghost = makeRobot(true);
  ghost.visible = false;
  world.add(ghost);
  ghostRun = ghostPoses = null;
  const sel = $("run"), gsel = $("ghost");
  sel.innerHTML = ""; gsel.innerHTML = "";
  gsel.add(new Option("No ghost (compare with another run)", -1));
  for (const [i, R] of C.runs.entries()) {
    sel.add(new Option(`${R.name}: ${R.result}, ${R.walked_m} m`, i));
    gsel.add(new Option(`Ghost: ${R.name}: ${R.result}, ${R.walked_m} m`, i));
  }
  $("runbox").style.display = C.runs.length ? "" : "none";
  $("sub").textContent = `${C.area}: ${C.length_m.toFixed(0)} m walk, climb ${C.climb_m.toFixed(0)} m, steepest ${C.max_grade_deg} deg. Trails: ${C.trails.slice(0, 4).join(", ")}`;
  scene.fog.near = 300; scene.fog.far = 2500;
  // Default: the furthest trained-policy run, with SONIC alone on the same stretch as a ghost when there is one.
  const isBase = (R) => /sonic_only|^bench_|^smoke/.test(R.name);
  const trained = C.runs.map((R, i) => [R, i]).filter(([R]) => !isBase(R)).sort((a, b) => b[0].walked_m - a[0].walked_m);
  const first = trained.length ? trained[0][1] : 0;
  if (C.runs.length) {
    await selectRun(first);
    const R0 = C.runs[first];
    const g = C.runs.findIndex((R) => /sonic_only/.test(R.name) && R.start_m === R0.start_m && R !== R0);
    if (g >= 0 && !isBase(R0)) { gsel.value = g; await selectGhost(g); }
  } else {
    controls.target.copy(toScene(r[0], r[1], 0)); camera.position.copy(toScene(r[0] - 60, r[1] - 60, 80));
  }
}

async function selectRun(i) {
  run = current.runs[i];
  poses = await getF32(`courses/${current.slug}/${run.file}`);
  frame = 0; playing = true; $("play").textContent = "Pause";
  $("stats").textContent = `${run.result}\nwalked ${run.walked_m} m at ${run.mean_speed_mps} m/s, steepest ${run.max_grade_deg} deg\nmode ${run.mode}, ${run.sim_s} s simulated`;
  $("hud").style.display = "";
  placeRobot(0, true);
}

async function selectGhost(i) {
  if (i < 0) { ghostRun = ghostPoses = null; ghost.visible = false; return; }
  ghostRun = current.runs[i];
  ghostPoses = await getF32(`courses/${current.slug}/${ghostRun.file}`);
  ghost.visible = true;
  placeRobot(frame, false);
}

function setPose(obj, P, f) {
  const n = nb(), o = f * n * 7;
  for (let b = 0; b < n; b++) {
    const k = o + b * 7, body = obj.userData.bodies[b];
    body.position.set(P[k], P[k + 1], (P[k + 2] - courseZ.base) * exag);
    body.quaternion.set(P[k + 4], P[k + 5], P[k + 6], P[k + 3]);
  }
  if (exag !== 1) obj.position.z = (heightAt(courseZ.h, courseZ.z, current.cell, P[o], P[o + 1]) - courseZ.base) * (exag - 1);
  else obj.position.z = 0;
}

const nb = () => robotDef.bodies.length;
const camState = { look: new THREE.Vector3(), head: 0, init: false };
function placeRobot(f, snap = false) {
  if (!poses) return;
  const n = nb(), o = f * n * 7;
  setPose(robot, poses, f);
  if (ghostPoses) setPose(ghost, ghostPoses, Math.min(f, ghostRun.frames - 1));  // a ghost that fell stays down
  const p = toScene(poses[o], poses[o + 1], (poses[o + 2] - courseZ.base) * exag);
  const T = run.frames, a = Math.max(0, f - 12) * n * 7, b = Math.min(T - 1, f + 12) * n * 7;
  const dx = poses[b] - poses[a], dy = poses[b + 1] - poses[a + 1];
  const head = Math.hypot(dx, dy) > 0.05 ? Math.atan2(dy, dx) : camState.head;
  if (snap || !camState.init) { camState.look.copy(p); camState.head = head; camState.init = true; }
  camState.look.lerp(p, 0.12);
  let dh = ((head - camState.head + Math.PI) % (2 * Math.PI) + 2 * Math.PI) % (2 * Math.PI) - Math.PI;
  camState.head += 0.05 * dh;
  if (chase) {
    const back = camState.head + Math.PI + 0.6;
    controls.target.copy(camState.look);
    camera.position.copy(camState.look).add(new THREE.Vector3(Math.cos(back) * 3.6, 1.4, -Math.sin(back) * 3.6));
  }
  sun.target.position.copy(p); sun.position.copy(p).add(new THREE.Vector3(-6, 12, 8));
  sun.shadow.camera.left = sun.shadow.camera.bottom = -6; sun.shadow.camera.right = sun.shadow.camera.top = 6; sun.shadow.camera.updateProjectionMatrix();
  $("scrub").value = Math.round((f / Math.max(1, T - 1)) * 1000);
  const t = f / run.fps;
  $("hud").textContent = `${current.area}  ${t.toFixed(1)} s` + (ghostPoses ? `   solid: ${run.name}   ghost: ${ghostRun.name}${f >= ghostRun.frames - 1 ? " (" + ghostRun.result + ")" : ""}` : "");
}

// ---------------- UI ----------------
function buildList() {
  const box = $("courses");
  for (const C of manifest.courses) {
    const d = document.createElement("div");
    d.className = "course"; d.dataset.slug = C.slug;
    const best = C.runs.reduce((m, R) => Math.max(m, R.walked_m), 0);
    d.innerHTML = `<b>${C.area}</b><span>${(C.length_m / 1000).toFixed(2)} km, climb ${C.climb_m.toFixed(0)} m, steepest ${C.max_grade_deg} deg, ${C.runs.length} runs${C.runs.length ? `, best ${best} m` : ""}</span>`;
    d.onclick = () => showCourse(C);
    box.appendChild(d);
  }
}
$("home").onclick = showArea;
$("exag").onchange = (e) => { exag = e.target.checked ? 3 : 1; current ? showCourse(current) : showArea(); };
$("photo").onchange = () => { current ? showCourse(current) : showArea(); };
$("run").onchange = (e) => selectRun(+e.target.value);
$("ghost").onchange = (e) => selectGhost(+e.target.value);
$("play").onclick = () => { playing = !playing; $("play").textContent = playing ? "Pause" : "Play"; };
$("chase").onclick = () => { chase = !chase; $("chase").textContent = chase ? "Free camera" : "Chase camera"; };
$("speed").onclick = () => { rate = rate === 1 ? 2 : rate === 2 ? 4 : 1; $("speed").textContent = rate + "x"; };
$("scrub").oninput = (e) => { if (run) { frame = Math.round((e.target.value / 1000) * (run.frames - 1)); placeRobot(frame, true); } };

const ray = new THREE.Raycaster(), mouse = new THREE.Vector2();
renderer.domElement.addEventListener("click", (e) => {
  if (current) return;
  mouse.set((e.clientX / innerWidth) * 2 - 1, -(e.clientY / innerHeight) * 2 + 1);
  ray.setFromCamera(mouse, camera);
  const hit = ray.intersectObjects(pins)[0];
  if (hit) showCourse(hit.object.userData.course);
});
renderer.domElement.addEventListener("mousemove", (e) => {
  const tip = $("tip");
  if (current) { tip.style.display = "none"; return; }
  mouse.set((e.clientX / innerWidth) * 2 - 1, -(e.clientY / innerHeight) * 2 + 1);
  ray.setFromCamera(mouse, camera);
  const hit = ray.intersectObjects(pins)[0];
  if (hit) { const C = hit.object.userData.course; tip.textContent = `${C.area}: ${(C.length_m / 1000).toFixed(1)} km, steepest ${C.max_grade_deg} deg`; tip.style.display = "block"; tip.style.left = e.clientX + 12 + "px"; tip.style.top = e.clientY + 12 + "px"; }
  else tip.style.display = "none";
});

function resize() { renderer.setSize(innerWidth, innerHeight, false); camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); }
addEventListener("resize", resize); resize();

let last = performance.now(), acc = 0;
function loop(now) {
  const dt = Math.min(0.1, (now - last) / 1000); last = now;
  if (run && playing) {
    acc += dt * rate * run.fps;
    while (acc >= 1) { frame = (frame + 1) % run.frames; acc -= 1; if (frame === 0) camState.init = false; }
    placeRobot(frame);
  }
  controls.update();
  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}

manifest = await (await fetch("manifest.json")).json();
buildList();
const want = new URLSearchParams(location.search).get("course");
const C0 = manifest.courses.find((c) => c.slug === want);
C0 ? await showCourse(C0) : await showArea();
requestAnimationFrame(loop);
</script>
<script src="pipeline.js" defer></script>
</body>
</html>
